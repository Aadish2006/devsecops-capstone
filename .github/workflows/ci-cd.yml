name: TaskBoard CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ════════════════════════════════════════
  # Job 1 — Test
  # ════════════════════════════════════════
  test:
    name: Test — Backend & Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run pytest
        run: pytest -v
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        run: npm install && npm run build
        working-directory: frontend

  # ════════════════════════════════════════
  # Job 2 — Build, Scan & Push to GHCR
  # ════════════════════════════════════════
  build-scan-push:
    name: Build, Scan & Push Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }} \
            ./frontend

      - name: Install Trivy scanner
        run: |
          sudo apt-get install -y wget
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Trivy scan — backend image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }}

      - name: Trivy scan — frontend image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }}

      - name: Push backend image to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }}

      - name: Push frontend image to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }}

  # ════════════════════════════════════════
  # Job 3 — Deploy to Kubernetes
  # ════════════════════════════════════════
  deploy:
    name: Deploy to Kubernetes
    needs: build-scan-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1.10.0

      - name: Create namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Deploy with Helm
        run: |
          helm upgrade --install taskboard ./helm/taskboard \
            --namespace taskboard --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ github.repository_owner }}/taskboard-backend \
            --set frontend.image=ghcr.io/${{ github.repository_owner }}/taskboard-frontend

      - name: Wait for backend pods
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=taskboard-backend \
            -n taskboard \
            --timeout=120s || true

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n taskboard
          echo "=== Services ==="
          kubectl get svc -n taskboard
          echo "=== Helm releases ==="
          helm list -n taskboard
