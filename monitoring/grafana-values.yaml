# Grafana values for standalone installation (optional).
# Use this if installing Grafana separately from kube-prometheus-stack.
#
# Install with:
#   helm install grafana grafana/grafana \
#     -n monitoring --create-namespace \
#     -f monitoring/grafana-values.yaml

adminUser: admin
adminPassword: taskboard

service:
  type: LoadBalancer

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        access: proxy
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: TaskBoard
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
